plugins { id 'com.android.application' }

android {
    namespace 'com.gradink.studio'
    compileSdk 35

    defaultConfig {
        applicationId 'com.gradink.studio'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '1.1'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release { minifyEnabled false }
    }
}
