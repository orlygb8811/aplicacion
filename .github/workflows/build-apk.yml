name: Compilar GradInk Studio APK
on:
  push:
    branches: [main]
    paths-ignore:
      - 'releases/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener proyecto
        uses: actions/checkout@v4
      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3
      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar APK de prueba firmado
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Comprobar APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          unzip -t app/build/outputs/apk/debug/app-debug.apk | tail -1
          ls -lh app/build/outputs/apk/debug/app-debug.apk
      - name: Publicar artefacto APK
        uses: actions/upload-artifact@v4
        with:
          name: GradInk-Studio-v1.1-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90
      - name: Publicar APK para descarga directa
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p releases
          cp app/build/outputs/apk/debug/app-debug.apk releases/GradInk_Studio_v1.1.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases/GradInk_Studio_v1.1.apk
          git commit -m "APK compilado GradInk Studio v1.1 [skip ci]" || exit 0
          git push origin HEAD:main
