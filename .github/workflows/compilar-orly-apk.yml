name: Orly Tattoo APK
on:
  push:
    branches: [orly-tattoo-inventario-v10-apk]
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Usar SDK Android preinstalado
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -al "$ANDROID_HOME/cmdline-tools/"
          echo "$ANDROID_HOME/cmdline-tools/16.0/bin" >> "$GITHUB_PATH"
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - run: gradle --no-daemon assembleDebug
      - name: Comprobar APK
        run: test -s app/build/outputs/apk/debug/app-debug.apk && unzip -t app/build/outputs/apk/debug/app-debug.apk | tail -1
      - uses: actions/upload-artifact@v4
        with:
          name: Orly-Tattoo-Inventario-V10-APK
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publicar archivo instalable en rama independiente
        run: |
          mkdir -p releases
          cp app/build/outputs/apk/debug/app-debug.apk releases/Orly_Tattoo_Inventario_V10.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases/Orly_Tattoo_Inventario_V10.apk
          git commit -m "APK Android Orly Tattoo Inventario V10" || true
          git push
